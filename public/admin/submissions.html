<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাস্ক প্রুফ রিভিউ ও বাল্ক একশন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-gray-950 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-4">
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <a href="/admin" class="text-gray-400 text-sm"><i class="fa-solid fa-arrow-left"></i> এডমিন হোম</a>
            <h2 class="font-bold text-yellow-500">পেন্ডিং টাস্ক সাবমিশন</h2>
            <button id="bulk_btn" onclick="processBulkTasks()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg font-bold text-xs">
                <i class="fa-solid fa-bolt"></i> বাল্ক প্রসেস (সর্বোচ্চ ৩০টি এপ্রুভ + ৩টি রিজেক্ট)
            </button>
        </div>

        <p class="text-xs text-gray-400">
            * বাল্ক বাটনে ক্লিক করলে সিস্টেম সর্বোচ্চ ৩০টি পেন্ডিং টাস্কের মধ্যে ৩টি র্যান্ডমলি রিজেক্ট করে বাকিগুলো স্বয়ংক্রিয়ভাবে অ্যাপ্রুভ করে ব্যালেন্স যোগ করে দেবে।
        </p>
    </div>

    <script src="/assets/js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroEarnX - Dashboard</title>

    <!-- ⚡ লগইন ছাড়া এক সেকেন্ডের জন্যও ড্যাশবোর্ড খুলবে না -->
    <script>
        (function() {
            const user = localStorage.getItem("mex_user");
            if (!user) {
                window.location.replace("/login");
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-[#FFF1F2] min-h-screen pb-16">

    <!-- Navbar -->
    <header class="bg-white/70 backdrop-blur-md sticky top-0 z-50 border-b border-rose-100 px-5 py-3.5 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-rose-600 to-red-500 flex items-center justify-center text-white shadow-sm">
                <i class="fa-solid fa-coins text-xs"></i>
            </div>
            <span class="text-lg font-bold text-gray-800 tracking-tight">MICRO<span class="text-rose-600">EARNX</span>⚡</span>
        </div>
        <button onclick="logout()" class="w-9 h-9 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center hover:bg-rose-100 transition shadow-sm">
            <i class="fa-solid fa-right-from-bracket text-sm"></i>
        </button>
    </header>

    <main class="max-w-sm mx-auto p-4 space-y-4">
        <!-- Site Notice -->
        <div class="bg-white/80 backdrop-blur-md border border-rose-100/80 p-3 rounded-2xl flex items-center gap-3 shadow-sm text-gray-700 text-xs">
            <div class="w-6 h-6 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-bullhorn text-xs"></i>
            </div>
            <marquee id="site_notice" class="font-medium text-gray-600">লোড হচ্ছে...</marquee>
        </div>

        <!-- Balance Card -->
        <div class="bg-gradient-to-br from-rose-500 via-rose-600 to-red-600 rounded-[32px] p-6 text-white shadow-xl shadow-rose-500/20 relative overflow-hidden">
            <div class="relative z-10">
                <span class="text-xs text-rose-100 font-medium">বর্তমান মূল ব্যালেন্স</span>
                <h1 id="user_balance" class="text-4xl font-extrabold mt-1 tracking-tight">0.00 ৳</h1>
                
                <div class="mt-5 flex gap-2">
                    <a href="/withdraw" class="bg-white text-rose-600 font-bold px-5 py-2.5 rounded-xl text-xs shadow-md active:scale-95 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-wallet"></i> টাকা উত্তোলন
                    </a>
                </div>
            </div>
            <i class="fa-solid fa-coins text-white/10 text-9xl absolute -right-6 -bottom-6"></i>
        </div>

        <!-- Earning Feature Cards -->
        <div class="grid grid-cols-2 gap-3">
            <a href="/tasks" class="bg-white/80 backdrop-blur-md border border-rose-100/70 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm hover:shadow-md transition">
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <span class="font-bold text-xs text-gray-700">টাস্ক পূরণ</span>
            </a>
            
            <a href="/games" class="bg-white/80 backdrop-blur-md border border-rose-100/70 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm hover:shadow-md transition">
                <div class="w-12 h-12 rounded-2xl bg-purple-50 text-purple-500 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-dharmachakra"></i>
                </div>
                <span class="font-bold text-xs text-gray-700">স্পিন & স্ক্র্যাচ</span>
            </a>
        </div>

        <!-- Referral Section -->
        <div class="bg-white/80 backdrop-blur-md border border-rose-100/80 p-5 rounded-[26px] shadow-sm space-y-2.5">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center">
                    <i class="fa-solid fa-share-nodes text-xs"></i>
                </div>
                <h3 class="font-bold text-xs text-gray-800">রেফার করে আয় করুন (১৫ ৳)</h3>
            </div>
            <p class="text-[11px] text-gray-500 leading-relaxed">
                আপনার রেফারেল কোড ব্যবহারে নতুন মেম্বার পাবে ১০০ ৳ বোনাস এবং আপনি পাবেন ১৫ ৳!
            </p>
            <div class="flex gap-1.5 pt-1">
                <input id="refer_link" readonly class="bg-rose-50/50 border border-rose-200/60 text-xs px-3 py-2.5 rounded-xl w-full text-gray-600 outline-none font-medium">
                <button onclick="navigator.clipboard.writeText(document.getElementById('refer_link').value); alert('লিংক কপি হয়েছে!')" 
                        class="bg-gray-800 text-white px-4 py-2.5 rounded-xl font-semibold text-xs active:scale-95 transition">
                    কপি
                </button>
            </div>
        </div>
    </main>

    <script src="/assets/js/fingerprint.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>loadDashboard();</script>
</body>
  </html>
